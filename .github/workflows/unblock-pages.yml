name: Desbloquear Pages
on:
  push:
    paths:
      - .github/workflows/unblock-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  cancel-stuck:
    runs-on: ubuntu-latest
    steps:
      - name: Cancelar implantação Pages travada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/rick-dev-rick/sonara-eclipse/pages/deployments/13ce802f2673841abf7171ff67ad05873ddedbe2/cancel"
